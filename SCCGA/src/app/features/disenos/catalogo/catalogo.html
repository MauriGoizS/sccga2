<div class="catalogo-container">
  
  <div class="header-section">
    <h1 class="catalogo-title">Catálogo de Diseños</h1>
    <p class="catalogo-subtitle">Gestiona y visualiza tus modelos disponibles</p>
  </div>

  <div class="toolbar-container">
    
    <div class="search-input-wrapper">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input 
        type="text" 
        [formControl]="searchControl" 
        placeholder="Buscar modelo o código..." 
        class="search-input"
      >
    </div>

    <div class="sort-select-wrapper">
      <select [formControl]="ordenControl" class="sort-select">
        <option value="fecha_desc">📅 Más Nuevos</option>
        <option value="fecha_asc">📅 Más Antiguos</option>
        <option value="nombre_asc">🔤 Nombre (A-Z)</option>
        <option value="nombre_desc">🔤 Nombre (Z-A)</option>
      </select>
    </div>

  </div>

  <div *ngIf="isLoading" class="loading-message">
    <div class="spinner"></div>
    <p>Cargando diseños...</p>
  </div>

  <div *ngIf="!isLoading && errorMensaje" class="error-message">
    <div class="error-icon">⚠️</div>
    <p>{{ errorMensaje }}</p>
    <button (click)="cargarPagina(paginaActual)" class="btn-retry">Reintentar</button>
  </div>

  <div *ngIf="!isLoading && !errorMensaje && listaVisible.length > 0" class="cards-grid">
    
    <div *ngFor="let item of listaVisible" class="card-diseno">
      
      <div class="card-image-wrapper">
        <img 
          [src]="obtenerImagen(item.imagen2)" 
          alt="{{ item.nombre_modelo }}" 
          class="card-img" 
          onerror="this.src='https://placehold.co/400x300/f3f4f6/9ca3af?text=Sin+Imagen'; this.onerror=null;"
        >
        <span class="card-badge">#{{ item.id_modelo }}</span>
      </div>

      <div class="card-content">
        <h3 class="model-name" title="{{ item.nombre_modelo }}">{{ item.nombre_modelo }}</h3>
        <div class="model-meta">
          <span class="label">Código:</span>
          <span class="value">{{ item.modelo }}</span>
        </div>
      </div>

      <div class="card-actions">
        <button (click)="editar(item.id_modelo!)" class="btn-action btn-edit" title="Editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <button (click)="eliminar(item.id_modelo!)" class="btn-action btn-delete" title="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>

    </div>
  </div>

  <div *ngIf="!isLoading && !errorMensaje && listaVisible.length === 0" class="no-data-message">
    <div class="empty-icon">🔍</div>
    <p>No encontramos diseños con esa búsqueda.</p>
  </div>

  <div *ngIf="!isLoading && !errorMensaje && totalPaginas > 1" class="pagination-controls">
    <button (click)="cambiarPagina(-1)" [disabled]="paginaActual === 1" class="btn-paginacion">
      ← Anterior
    </button>
    
    <div class="page-input-container">
      <span class="page-label">Página</span>
      <input 
        type="number" 
        [value]="paginaActual" 
        (change)="irAPaginaManual($event)"
        min="1" 
        [max]="totalPaginas"
        class="input-pagina"
      >
      <span class="page-label">de {{ totalPaginas }}</span>
    </div>

    <button (click)="cambiarPagina(1)" [disabled]="paginaActual === totalPaginas" class="btn-paginacion">
      Siguiente →
    </button>
  </div>

</div>
